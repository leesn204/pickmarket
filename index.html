<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>픽마켓 | 영상 속 추천템</title><meta name="description" content="릴스와 쇼츠 속 추천 상품을 카테고리별로 찾아보세요."><style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#182132;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.wrap{max-width:1160px;margin:auto;padding:0 16px}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e7eb}.top{display:flex;gap:14px;align-items:center;padding:13px 0}.logo{font-weight:900;font-size:24px;letter-spacing:-1.4px}.logo b{color:#f04462}.search{flex:1;border:1px solid #d8dce4;background:#f7f8fa;border-radius:11px;padding:12px;min-width:0}.hero{background:linear-gradient(115deg,#171c32,#3d2552);color:white;border-radius:18px;padding:28px;margin:22px 0 16px}.hero h1{margin:0 0 8px;font-size:clamp(23px,4vw,34px)}.hero p{margin:0;color:#e5deed}.notice{font-size:12px;color:#687184;padding:10px 0 16px}.nav{display:flex;gap:8px;overflow:auto;padding:0 0 12px;scrollbar-width:thin}.pill{border:1px solid #dfe3eb;border-radius:30px;background:#fff;padding:10px 16px;white-space:nowrap}.pill.active{background:#1b2334;color:#fff;border-color:#1b2334}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 20px}.filters select{border:1px solid #dce0e7;background:white;border-radius:9px;padding:9px;max-width:100%}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.sectionTitle h2{font-size:21px;margin:0}.count{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-bottom:35px}.card{min-width:0;background:white;border:1px solid #e5e8ee;border-radius:15px;overflow:hidden;box-shadow:0 4px 16px #20283b07}.thumb{position:relative;aspect-ratio:3/4;background:linear-gradient(145deg,#e5e8f1,#f9dce5);display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.thumb .fallback{font-size:55px}.play{position:absolute;bottom:10px;left:10px;background:#131722cc;color:white;border-radius:20px;padding:7px 10px;font-size:12px}.body{padding:12px}.tag{font-size:11px;color:#e03d61;font-weight:750}.name{font-weight:750;font-size:14px;line-height:1.4;min-height:40px;margin:6px 0}.price{font-size:16px;font-weight:850;margin:6px 0 12px}.price small{font-weight:400;color:#737b8a;font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.btn{border:0;border-radius:9px;padding:10px 6px;font-size:12px;font-weight:750;text-align:center}.videoBtn{background:#f0f2f6}.shopBtn{background:#ed4564;color:white}.disabled{opacity:.45;cursor:not-allowed}.empty{text-align:center;padding:65px 15px;color:#6b7280;background:#fff;border-radius:14px}.modal{position:fixed;inset:0;background:#000c;z-index:40;display:none;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.panel{background:#12151c;color:#fff;width:min(430px,100%);border-radius:18px;overflow:hidden;position:relative}.panel video{width:100%;max-height:70vh;display:block;background:#000}.panel .desc{padding:12px 15px}.close{position:absolute;right:12px;top:12px;background:#fff;color:#111;border:0;border-radius:50%;width:35px;height:35px;font-size:20px;z-index:2}.panel a{display:block;text-align:center;background:#ef4567;color:#fff;padding:14px;font-weight:800}.panel a.disabled{pointer-events:none}.foot{padding:25px 0 40px;color:#7b8493;font-size:12px;border-top:1px solid #e0e4eb;line-height:1.8}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #5374ff;outline-offset:2px}@media(max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}}@media(max-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.wrap{padding:0 10px}.body{padding:9px}.name{font-size:12px}.price{font-size:13px}.actions{grid-template-columns:1fr}.btn{padding:9px 4px}.hero{padding:20px;margin-top:13px}.top{gap:8px}.logo{font-size:21px}.search{padding:10px}.thumb .fallback{font-size:36px}.play{font-size:10px}}@media(max-width:350px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><div class="wrap"><div class="top"><a class="logo" href="./">픽<b>마켓</b></a><input class="search" id="search" type="search" placeholder="영상 속 상품 검색" aria-label="상품 검색"></div><nav class="nav" id="nav" aria-label="대분류"></nav></div></header><main class="wrap"><section class="hero"><h1>영상에서 본 그 상품 ✨</h1><p>짧은 영상으로 보고, 마음에 들면 상품 확인!</p></section><div class="notice">이 페이지에는 쿠팡 파트너스 활동을 통해 일정액의 수수료를 제공받을 수 있는 광고 링크가 포함되어 있습니다. 상품 가격·재고는 판매처에서 확인하세요.</div><div class="filters"><select id="mid" aria-label="중분류"></select><select id="sub" aria-label="소분류"></select><select id="sort" aria-label="정렬"><option value="new">최신 등록순</option><option value="name">이름순</option><option value="low">가격 낮은순</option><option value="high">가격 높은순</option></select></div><div class="sectionTitle"><h2>릴스 추천템</h2><span class="count" id="count"></span></div><section id="grid" class="grid" aria-live="polite"></section></main><footer class="wrap foot">픽마켓은 상품을 직접 판매하지 않는 제휴 링크 소개 페이지입니다. 주문, 결제, 배송, 환불은 연결된 판매처에서 진행됩니다.<br>문의: <span id="contact">운영자 정보 준비 중</span></footer><div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="상품 영상"><div class="panel"><button id="close" class="close" aria-label="닫기">×</button><video id="player" controls playsinline preload="none"></video><div class="desc" id="videoTitle"></div><a id="modalShop" target="_blank" rel="noopener noreferrer sponsored" href="#">쿠팡에서 상품 보기 ↗</a></div></div><script>
'use strict';let items=[],big='전체',mid='전체',sub='전체';const $=id=>document.getElementById(id);const safeUrl=(u,kind)=>{try{const x=new URL(u,location.href);if(!['https:','http:'].includes(x.protocol))return '';if(kind==='shop'&&!/^https:$/.test(x.protocol))return '';return x.href}catch{return ''}};const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=String(text);return e};function unique(key,rows){return [...new Set(rows.map(x=>x[key]).filter(Boolean))]};function option(select,values,selected){select.replaceChildren();for(const v of ['전체',...values]){const o=el('option','',v);o.value=v;select.append(o)}select.value=values.includes(selected)?selected:'전체';return select.value};function filtered(level){return items.filter(x=>(big==='전체'||x.category===big)&&(level===1||mid==='전체'||x.middle===mid)&&(level===2||sub==='전체'||x.sub===sub))};function categories(){const cats=unique('category',items);const nav=$('nav');nav.replaceChildren();for(const c of ['전체',...cats]){const b=el('button','pill'+(big===c?' active':''),c);b.type='button';b.onclick=()=>{big=c;mid='전체';sub='전체';categories();render()};nav.append(b)}mid=option($('mid'),unique('middle',filtered(1)),mid);sub=option($('sub'),unique('sub',filtered(2)),sub)}function render(){const q=$('search').value.trim().toLowerCase();let rows=filtered(3).filter(x=>([x.name,x.description,x.category,x.middle,x.sub,x.tags].join(' ').toLowerCase().includes(q)));const sort=$('sort').value;if(sort==='low')rows.sort((a,b)=>Number(a.price||0)-Number(b.price||0));if(sort==='high')rows.sort((a,b)=>Number(b.price||0)-Number(a.price||0));if(sort==='name')rows.sort((a,b)=>a.name.localeCompare(b.name,'ko'));if(sort==='new')rows.sort((a,b)=>Number(b.id||0)-Number(a.id||0));$('count').textContent=rows.length+'개 상품';const grid=$('grid');grid.replaceChildren();if(!rows.length){grid.className='empty';grid.textContent='조건에 맞는 상품이 없습니다.';return}grid.className='grid';for(const x of rows){const card=el('article','card'),thumb=el('div','thumb');const img=safeUrl(x.image,'image');if(img){const i=el('img');i.src=img;i.alt=x.name;i.loading='lazy';i.onerror=()=>i.replaceWith(el('span','fallback','🎁'));thumb.append(i)}else thumb.append(el('span','fallback','🎁'));const video=safeUrl(x.video,'video');if(video)thumb.append(el('span','play','▶ 영상 보기'));const body=el('div','body');body.append(el('div','tag',[x.category,x.middle,x.sub].filter(Boolean).join(' › ')),el('div','name',x.name),el('div','price',x.price?Number(x.price).toLocaleString('ko-KR')+'원':'판매처 가격 확인'));const actions=el('div','actions');const vb=el('button','btn videoBtn'+(!video?' disabled':''),'▶ 영상');vb.disabled=!video;vb.onclick=()=>openVideo(x);const shop=safeUrl(x.link,'shop');const sb=el('a','btn shopBtn'+(!shop?' disabled':''),'상품 보기 ↗');sb.href=shop||'#';sb.target='_blank';sb.rel='noopener noreferrer sponsored';if(!shop){sb.removeAttribute('href');sb.setAttribute('aria-disabled','true')}actions.append(vb,sb);body.append(actions);card.append(thumb,body);grid.append(card)}}function openVideo(x){const url=safeUrl(x.video,'video');if(!url)return;const player=$('player');player.src=url;player.load();$('videoTitle').textContent=x.name;const shop=safeUrl(x.link,'shop');$('modalShop').href=shop||'#';$('modalShop').classList.toggle('disabled',!shop);$('modal').classList.add('open');$('close').focus()}function closeVideo(){$('player').pause();$('player').removeAttribute('src');$('player').load();$('modal').classList.remove('open')}$('close').onclick=closeVideo;$('modal').onclick=e=>{if(e.target===$('modal'))closeVideo()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVideo()});$('search').oninput=render;$('sort').onchange=render;$('mid').onchange=()=>{mid=$('mid').value;sub='전체';categories();render()};$('sub').onchange=()=>{sub=$('sub').value;render()};fetch('./products.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('파일 없음');return r.json()}).then(data=>{items=Array.isArray(data.products)?data.products.filter(x=>x&&x.name):[];if(data.contact)$('contact').textContent=data.contact;categories();render()}).catch(()=>{$('grid').className='empty';$('grid').textContent='상품 데이터를 불러오지 못했습니다. 웹 서버에서 실행하거나 products.json 파일을 확인하세요.'});
</script></body></html>
