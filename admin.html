<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>픽마켓 상품 관리 (로컬 편집기)</title><style>*{box-sizing:border-box}body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f3f5f9;color:#202633;margin:0}.wrap{max-width:1000px;margin:25px auto;padding:0 14px}h1{font-size:25px}.alert{background:#fff4dc;border:1px solid #f0d4a3;padding:15px;border-radius:10px;line-height:1.7}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,.file{border:0;border-radius:9px;background:#26314c;color:white;padding:11px 15px;cursor:pointer;font-weight:700}button.secondary,.file{background:#e3e8f2;color:#253149}.danger{background:#bd3551}input,textarea{width:100%;border:1px solid #d6dbe5;border-radius:8px;padding:10px;background:white;font:inherit}label{display:block;font-size:13px;font-weight:750;margin-bottom:5px}form{background:white;border-radius:15px;padding:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.list{margin-top:20px}.item{display:flex;justify-content:space-between;gap:10px;background:#fff;padding:12px;margin:7px 0;border-radius:9px;align-items:center}.item span{min-width:0;overflow-wrap:anywhere}.item button{padding:8px 10px}small{color:#626b7c}a{color:#354db4}@media(max-width:650px){form{grid-template-columns:1fr}.full{grid-column:auto}.item{flex-wrap:wrap}}</style></head><body><main class="wrap"><h1>🛠 픽마켓 상품 관리</h1><div class="alert"><strong>보안 안내:</strong> 이 페이지는 로그인형 관리자 서버가 아닌 <strong>로컬 JSON 편집 도구</strong>입니다. 공개 웹사이트에 admin.html을 올리지 마세요. 상품을 수정한 뒤 <strong>products.json 다운로드</strong>를 누르고 GitHub 저장소의 같은 파일을 교체해야 공개 사이트에 반영됩니다. 비밀번호나 쿠팡 계정 정보를 입력하지 마세요.</div><div class="toolbar"><label class="file" for="upload">products.json 불러오기</label><input id="upload" type="file" accept=".json,application/json" hidden><button id="download">products.json 다운로드</button><button id="reset" class="secondary">입력 초기화</button><a href="index.html" target="_blank" rel="noopener">쇼핑몰 보기 ↗</a></div><label for="contact">운영자 문의 정보 (공개)</label><input id="contact" placeholder="문의 이메일 주소"><h2 id="formtitle">상품 추가</h2><form id="form"><div><label>상품명 *</label><input name="name" required maxlength="120"></div><div><label>가격 (원, 모르면 0)</label><input name="price" type="number" min="0" step="1" value="0"></div><div><label>대분류 *</label><input name="category" required placeholder="생활·주방"></div><div><label>중분류</label><input name="middle" placeholder="주방정리"></div><div><label>소분류</label><input name="sub" placeholder="수납"></div><div><label>검색 태그</label><input name="tags" placeholder="꿀템, 주방"></div><div class="full"><label>상품 이미지 URL (https://)</label><input name="image" type="url" placeholder="https://..."></div><div class="full"><label>직접 호스팅한 MP4 영상 URL (https://)</label><input name="video" type="url" placeholder="https://.../video.mp4"><small>인스타그램/유튜브 페이지 주소는 HTML5 비디오로 직접 재생되지 않습니다. 권리가 있는 MP4 영상의 직접 URL을 입력하세요.</small></div><div class="full"><label>쿠팡파트너스 상품 링크 (https://)</label><input name="link" type="url" placeholder="https://link.coupang.com/..."></div><div class="full"><label>간단한 상품 설명</label><textarea name="description" rows="2"></textarea></div><div class="full"><button type="submit" id="save">상품 추가</button> <button type="button" class="secondary" id="cancel">수정 취소</button></div></form><h2>상품 목록 <small id="count"></small></h2><div class="list" id="list"></div></main><script>
'use strict';let data={contact:'',products:[]},editing=null;const $=x=>document.getElementById(x),f=$('form');const fields=['name','price','category','middle','sub','tags','image','video','link','description'];const validUrl=u=>{if(!u)return true;try{return new URL(u).protocol==='https:'}catch{return false}};function list(){const box=$('list');box.replaceChildren();$('count').textContent=data.products.length+'개';for(const p of [...data.products].sort((a,b)=>b.id-a.id)){const row=document.createElement('div');row.className='item';const t=document.createElement('span');t.textContent=`${p.name} · ${p.category||''} / ${p.middle||''} / ${p.sub||''}`;const actions=document.createElement('div');const edit=document.createElement('button');edit.textContent='수정';edit.onclick=()=>{editing=p.id;for(const key of fields)f.elements[key].value=p[key]??'';$('formtitle').textContent='상품 수정';$('save').textContent='수정 저장';f.scrollIntoView({behavior:'smooth'})};const del=document.createElement('button');del.textContent='삭제';del.className='danger';del.onclick=()=>{if(confirm('이 상품을 삭제할까요?')){data.products=data.products.filter(x=>x.id!==p.id);list()}};actions.append(edit,del);row.append(t,actions);box.append(row)}}function reset(){editing=null;f.reset();$('formtitle').textContent='상품 추가';$('save').textContent='상품 추가'}$('reset').onclick=reset;$('cancel').onclick=reset;f.onsubmit=e=>{e.preventDefault();const p={};for(const key of fields)p[key]=f.elements[key].value.trim();for(const key of ['image','video','link'])if(!validUrl(p[key])){alert(key+' 항목은 https:// 주소만 입력하세요.');return}p.price=Number(p.price)||0;p.id=editing??Math.max(0,...data.products.map(x=>Number(x.id)||0))+1;if(editing!==null)data.products=data.products.map(x=>x.id===editing?p:x);else data.products.push(p);reset();list();alert('상품 수정 내용이 편집기에 반영되었습니다. 공개 쇼핑몰에 적용하려면 상단의 products.json 다운로드 후 GitHub 파일을 교체하세요.')};$('upload').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.products)||parsed.products.length>10000)throw Error('products 배열 형식이 올바르지 않습니다.');data={contact:String(parsed.contact||''),products:parsed.products.filter(x=>x&&typeof x.name==='string').map(x=>({...x,id:Number(x.id)||0}))};$('contact').value=data.contact;reset();list()}catch(err){alert('불러오기 실패: '+err.message)}e.target.value=''};$('download').onclick=()=>{data.contact=$('contact').value.trim();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='products.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};fetch('./products.json').then(r=>r.json()).then(p=>{if(Array.isArray(p.products)){data=p;$('contact').value=data.contact||'';list()}}).catch(()=>list());
</script></body></html>
